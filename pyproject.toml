[project]
name = "evidenceforge"
version = "0.1.0"
description = "Traceable clinical evidence-synthesis prototype"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "EvidenceForge contributors" }]
dependencies = [
  "alembic>=1.14,<2",
  "defusedxml>=0.7,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "openai>=1.68,<3",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0,<3",
  "streamlit>=1.60,<2",
  "structlog>=25.1,<26",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
  "weasyprint>=69,<70",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pytest-asyncio>=0.25,<2",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "types-defusedxml>=0.7,<1",
  "types-pyyaml>=6,<7",
  "pypdf>=6,<7",
]

[project.scripts]
evidenceforge = "evidenceforge.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "evidenceforge/prompts"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
  "integration: opt-in tests that call live external services",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["evidenceforge"]
