name: Bug
description: Report a reproducible defect; send suspected vulnerabilities via SECURITY.md
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety screening
      options:
        - label: This report contains no secrets or PHI.
          required: true
